name: Tests automatises

on:
  push:
    branches:
      - '**'
    paths:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-unitaires:
    name: Tests unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executer les tests unitaires
        run: |
          python -m unittest discover -v tests_unitaire > unit-test-results.txt 2>&1
          cat unit-test-results.txt

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-unitaires
          path: unit-test-results.txt
          if-no-files-found: ignore

  tests-api:
    name: Tests API
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances Robot Framework
        run: |
          python -m pip install --upgrade robotframework robotframework-requests
          python -m pip install --upgrade -r requirements.txt

      - name: Executer les tests API
        run: python -m robot --outputdir reports/api tests_api

      - name: Executer les tests API Pytest
        run: python -m pytest tests/test_api --html=reports/api-pytest/results_api.html --self-contained-html -q

      - name: Conserver les rapports API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-api
          path: reports/api*
          if-no-files-found: ignore

  tests-ihm:
    name: Tests IHM
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances Robot Framework et Selenium
        run: python -m pip install --upgrade robotframework robotframework-seleniumlibrary selenium

      - name: Verifier Chrome du runner
        run: |
          google-chrome --version
          if command -v chromedriver >/dev/null 2>&1; then
            sudo rm -f "$(command -v chromedriver)"
          fi

      - name: Attendre la disponibilite du site IHM
        run: |
          echo "Adresses IPv4 resolues :"
          getent ahostsv4 livraison3.testacademy.fr || true
          for attempt in 1 2 3 4 5 6; do
            if curl --ipv4 --fail --silent --show-error --connect-timeout 10 --max-time 30 http://livraison3.testacademy.fr/ > /dev/null; then
              echo "Site IHM disponible (tentative $attempt)"
              exit 0
            fi
            echo "Site IHM indisponible (tentative $attempt/6)"
            sleep 10
          done
          echo "Le site IHM est inaccessible apres 6 tentatives"
          exit 1

      - name: Executer les tests IHM dans un affichage virtuel
        run: xvfb-run --auto-servernum python -m robot --outputdir reports/ihm tests_ihm

      - name: Conserver les rapports IHM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-ihm
          path: reports/ihm
          if-no-files-found: ignore

  tests-performance:
    name: Tests de performance
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: python -m pip install --upgrade -r requirements.txt

      - name: Executer les tests de performance
        env:
          RUN_PERFORMANCE: '1'
        run: python -m pytest tests_performance -m performance -s -q | tee reports-performance.txt

      - name: Conserver le rapport performance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-performance
          path: reports-performance.txt
          if-no-files-found: ignore