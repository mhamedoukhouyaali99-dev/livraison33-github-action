name: Tests automatises

on:
  push:
    branches:
      - '**'
    paths:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-unitaires:
    name: Tests unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executer les tests unitaires
        run: |
          python -m unittest discover -v tests_unitaire > unit-test-results.txt 2>&1
          cat unit-test-results.txt

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-unitaires
          path: unit-test-results.txt
          if-no-files-found: ignore

  tests-api:
    name: Tests API
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances Robot Framework
        run: python -m pip install --upgrade robotframework robotframework-requests

      - name: Executer les tests API
        run: python -m robot --outputdir reports/api tests_api

      - name: Conserver les rapports API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-api
          path: reports/api
          if-no-files-found: ignore

  tests-ihm:
    name: Tests IHM
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Chrome stable
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
          install-chromedriver: true

      - name: Installer les dependances Robot Framework et Selenium
        run: python -m pip install --upgrade robotframework robotframework-seleniumlibrary selenium

      - name: Verifier Chrome et ChromeDriver
        run: |
          google-chrome --version
          chromedriver --version

      - name: Diagnostiquer l acces au site IHM
        run: |
          python - <<'PY'
          from urllib.request import urlopen

          urls = [
              "http://livraison3.testacademy.fr/",
              "http://livraison3.testacademy.fr/index.php/listing/beautiful-cove/",
          ]
          for url in urls:
              try:
                  with urlopen(url, timeout=30) as response:
                      body = response.read(1000).decode("utf-8", errors="replace")
                      print(f"URL={url}")
                      print(f"STATUS={response.status}")
                      print(f"FINAL_URL={response.geturl()}")
                      print(f"BODY={body.replace(chr(10), ' ')[:500]}")
              except Exception as error:
                  print(f"URL={url} ERROR={error}")

      - name: Executer les tests IHM dans un affichage virtuel
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: xvfb-run --auto-servernum python -m robot --outputdir reports/ihm tests_ihm

      - name: Conserver les rapports IHM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-ihm
          path: reports/ihm
          if-no-files-found: ignore